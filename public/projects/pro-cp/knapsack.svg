<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" role="img"><title>One copy of each book. One budget.</title><desc>0/1 KNAPSACK · update budgets from high to low Descending updates prevent using the same book more than once.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363df"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a4b7d1"/></marker></defs><rect width="980" height="600" fill="#f1f6ff"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="59" font-size="32" fill="#102745" font-weight="700" text-anchor="start">One copy of each book. One budget.</text><text x="48" y="94" font-size="19" fill="#536c8c" font-weight="400" text-anchor="start">0/1 KNAPSACK · update budgets from high to low</text><rect x="62" y="170" width="190" height="232" rx="14" fill="#e3edff" stroke="#2363df" stroke-width="2"/><text x="86" y="210" font-size="20" fill="#233958" font-weight="400" text-anchor="start">Book 1</text><text x="86" y="269" font-size="28" fill="#183865" font-weight="700" text-anchor="start">4 coins</text><text x="86" y="311" font-size="23" fill="#233958" font-weight="400" text-anchor="start">5 pages</text><text x="86" y="373" font-size="16" fill="#2363df" font-weight="700" text-anchor="start">TAKE</text><rect x="288" y="170" width="190" height="232" rx="14" fill="#fff" stroke="#d5e0f0" stroke-width="2"/><text x="312" y="210" font-size="20" fill="#233958" font-weight="400" text-anchor="start">Book 2</text><text x="312" y="269" font-size="28" fill="#183865" font-weight="700" text-anchor="start">8 coins</text><text x="312" y="311" font-size="23" fill="#233958" font-weight="400" text-anchor="start">12 pages</text><text x="312" y="373" font-size="16" fill="#617895" font-weight="700" text-anchor="start">SKIP</text><rect x="514" y="