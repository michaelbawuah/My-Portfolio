<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" role="img"><title>Search for the first yes.</title><desc>FACTORY MACHINES · machine times: 3, 2, 5 · target: 7 products Monotone predicate: if time t is enough, every later time is enough.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363df"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a4b7d1"/></marker></defs><rect width="980" height="600" fill="#f1f6ff"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="59" font-size="32" fill="#102745" font-weight="700" text-anchor="start">Search for the first yes.</text><text x="48" y="94" font-size="19" fill="#536c8c" font-weight="400" text-anchor="start">FACTORY MACHINES · machine times: 3, 2, 5 · target: 7 products</text><rect x="62" y="168" width="390" height="274" rx="14" fill="#ffffff" stroke="#d5e0f0" stroke-width="2"/><rect x="488" y="168" width="430" height="274" rx="14" fill="#e3edff" stroke="#2363df" stroke-width="2"/><text x="92" y="214" font-size="22" fill="#617895" font-weight="600" text-anchor="start">TIME = 7</text><text x="92" y="280" font-size="33" fill="#173460" font-weight="700" text-anchor="start">2 + 3 + 1 = 6</text><text x="92" y="332" font-size="21" fill="#233958" font-weight="400" text-anchor="start">Below the target of 7.</text><text x="522" y="214" font-size="22" fill="#2363df" font-weight="600" text-anchor="start">TIME = 8</text><text x="522" y="280" font-size="33" fill="#173460" font-weight="700" text-anchor="start">2 + 4 + 1 = 7</text><text x="522" y="332" font-size="21" fill="#233958" font-weight="400" text-anchor="start">The first feasible time.</text><path d="M48 518H932" stroke="#d5e0f0"/><text x="48" y="557" font-size="20" fill="#244368" font-weight="400" text-anchor="start">Monotone predicate: if time t is enough, every later time is enough.</text></g></svg>